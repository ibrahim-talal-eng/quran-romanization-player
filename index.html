<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#143a32">
  <title>Quran Romanization Player</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E۞%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gentium+Plus:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/tom-select@2.7.0/dist/css/tom-select.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="page-header">
      <div>
        <p class="eyebrow">QURAN STUDY TOOL</p>
        <h1>Quran Romanization Player</h1>
        <p class="subtitle">Follow a recitation word by word with synchronized highlighting.</p>
      </div>
      <span class="source-mark">QUA WORD TIMINGS</span>
    </header>

    <section class="panel settings-panel" aria-label="Player settings">
      <div class="field reciter-field">
        <label for="reciter">Reciter</label>
        <div class="inline-control">
          <select id="reciter" disabled>
            <option value="">Loading recitations…</option>
          </select>
          <button id="refresh" class="button button-secondary" type="button" title="Refresh reciters">↻</button>
        </div>
      </div>

      <div class="settings-row">
        <div class="field surah-field">
          <label for="surah">Surah</label>
          <select id="surah"></select>
        </div>

        <div class="field ayah-field">
          <label for="start-ayah">Start at ayah</label>
          <input id="start-ayah" type="number" min="1" value="1" inputmode="numeric">
        </div>
      </div>
    </section>

    <section class="panel reader-panel">
      <div class="reader-toolbar">
        <div class="reader-heading">
          <span class="eyebrow">ROMANIZED TEXT</span>
          <span id="loaded-label" class="loaded-label">No surah loaded</span>
        </div>

        <div class="transport">
          <button id="prev-ayah" class="button button-secondary" type="button" title="Previous ayah">|◀ Ayah</button>
          <button id="back-5" class="button button-secondary compact" type="button" title="Back 5 seconds">◀ 5s</button>
          <button id="play" class="button button-primary play-button" type="button">▶ Play</button>
          <button id="pause" class="button button-secondary" type="button" disabled>❚❚ Pause</button>
          <button id="forward-5" class="button button-secondary compact" type="button" title="Forward 5 seconds">5s ▶</button>
          <button id="next-ayah" class="button button-secondary" type="button" title="Next ayah">Ayah ▶|</button>
          <button id="stop" class="button button-stop" type="button">■ Stop</button>
        </div>
      </div>

      <article id="reader" class="reader" aria-label="Romanized Quran text">
        <div class="empty-state">
          <div class="empty-symbol">۞</div>
          <p>Select a reciter and surah, then press Play.</p>
        </div>
      </article>
    </section>

    <footer class="statusbar">
      <p id="status" role="status" aria-live="polite">Loading QUA catalog and manifest…</p>
      <span>Audio streams from QUA</span>
    </footer>

    <audio id="audio" preload="metadata"></audio>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/tom-select@2.7.0/dist/js/tom-select.complete.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
